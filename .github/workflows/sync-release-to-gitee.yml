# 手动补同步：GitHub Release（含附件）同步到 Gitee
# 说明：自动同步已内嵌到 build.yml（构建完成后本地直传 Gitee，无需下载再上传）。
#       本 workflow 仅用于手动补跑（如历史 Release、上传失败后的重试、更新说明）。
# 触发：Actions 页面手动运行；不再监听 release: published（避免与构建流程重复执行）
# 前提：仓库 Settings -> Secrets and variables -> Actions 中配置 GITEE_TOKEN
#       （Gitee 私人令牌，https://gitee.com/profile/personal_access_tokens，勾选 projects 权限）

name: Sync Release to Gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release 标签，留空则同步最新正式版'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 同步 Release 到 Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: txlong
          GITEE_REPO: maidong-destop
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: bash scripts/sync-release-to-gitee.sh
