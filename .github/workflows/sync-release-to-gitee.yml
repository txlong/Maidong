# 发布即同步：GitHub Release（含附件）同步到 Gitee
# 触发：GitHub Release 正式发布后自动执行；也可在 Actions 页面手动运行
# 前提：仓库 Settings -> Secrets and variables -> Actions 中配置 GITEE_TOKEN
#       （Gitee 私人令牌，https://gitee.com/profile/personal_access_tokens，勾选 projects 权限）

name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release 标签，留空则同步最新正式版'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 同步 Release 到 Gitee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: txlong
          GITEE_REPO: MaidongDestop
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: bash scripts/sync-release-to-gitee.sh
