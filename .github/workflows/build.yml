name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1) 先创建（或复用）唯一的 GitHub Release（草稿状态）
  #    避免 mac / win 两个并行 job 各自去创建 Release 造成重复
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 创建或复用 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，复用（不重复创建）"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
            echo "已创建草稿 Release $TAG"
          fi

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: 准备 macOS 签名与公证凭证
        run: |
          if [ -n "$CERT_BASE64" ]; then
            echo "$CERT_BASE64" | base64 -d > mac-cert.p12
            echo "CSC_LINK=mac-cert.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "[sign] macOS 证书已就绪"
          else
            echo "[sign] 未提供 macOS 证书，构建未签名版本"
          fi
          if [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM" >> "$GITHUB_ENV"
            echo "[sign] Apple 公证凭证已就绪"
          else
            echo "[sign] 未提供 Apple 公证凭证，跳过公证"
          fi
        env:
          CERT_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        with:
          name: mac-dmg
          path: dist/*.dmg

  win:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: 准备 Windows 签名凭证
        shell: bash
        run: |
          if [ -n "$CERT_BASE64" ]; then
            echo "$CERT_BASE64" | base64 -d > win-cert.pfx
            echo "CSC_LINK=win-cert.pfx" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "[sign] Windows 证书已就绪"
          else
            echo "[sign] 未提供 Windows 证书，构建未签名版本"
          fi
        env:
          CERT_BASE64: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        with:
          name: win-exe
          path: dist/*.exe

  # 2) mac / win 都上传完成后，再把草稿 Release 转为正式发布
  publish:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - name: 发布 Release（取消草稿状态）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
